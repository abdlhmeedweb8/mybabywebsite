<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="download.png">
    <title>رسالتك لي  💌</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ff7da5, #ffc3a0);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Tajawal", sans-serif;
            color: #fff;
            text-align: center;
            position: relative;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 32px;
            text-shadow: 0 0 10px rgba(255,255,255,0.7);
            z-index: 2;
        }

        form {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
        }

        textarea {
            width: 100%;
            height: 300px;
            border: none;
            border-radius: 20px;
            padding: 20px;
            font-size: 18px;
            resize: none;
            outline: none;
            background-color: rgba(255, 255, 255, 0.85);
            color: #b3003b;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
            margin-bottom: 20px;
        }

        button {
            background-color: rgba(255, 0, 85, 0.9);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: rgba(255, 50, 100, 1);
            transform: scale(1.1);
        }

        /* قلوب الخلفية */
        .heart {
            position: fixed;
            bottom: -10px;
            color: rgba(255,255,255,0.6);
            font-size: 20px;
            animation: floatUp 6s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
        }

        /* للجوال */
        @media (max-width: 600px) {
            textarea {
                height: 200px;
                font-size: 16px;
            }
            h1 {
                font-size: 24px;
            }
            button {
                font-size: 16px;
                padding: 8px 20px;
            }
        }
    </style>
</head>
<body>
    <h1>اكتبي رسالتك هنا يا حلوة❤️</h1>

    <!-- نموذج الإرسال -->
    <form action="https://formspree.io/f/xovkrora" method="POST">
        <textarea name="message" placeholder="اكتبي كلامك الحلو هنا..." required></textarea>
        <button type="submit">إرسال الرسالة 💌</button>
    </form>

    <!-- زر الرجوع -->
    <button style="margin-top: 15px; background-color:#b3003b;" onclick="window.location.href='page3.html'">رجوع</button>

    <!-- القلوب -->
    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.textContent = '❤';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (16 + Math.random() * 20) + 'px';
            heart.style.animationDuration = (4 + Math.random() * 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }
        setInterval(createHeart, 500);
    </script>
</body>
</html>
